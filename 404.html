<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pocket Resus has moved</title>
<link rel="canonical" href="https://pocket-resus.web.app/" />
<meta name="robots" content="noindex, follow" />
<!-- No meta-refresh fallback on purpose. It could only ever target the root, so it sent
     no-JS visitors to the wrong page; it imposed an uncancellable 3s deadline (WCAG 2.2.1);
     and because it pushes a history entry, Back landed here and restarted the countdown.
     Without JS this app cannot run anyway, so a persistent page with a working link beats
     an auto-redirect to a React SPA the visitor could not have used. -->
<style>
  :root { --gold:#F1B82D; --ink:#f3f4f6; --muted:#9ca3af; --bg:#0a0a0a; --card:#141414; --border:#222; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100svh; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:420px; width:100%; text-align:center; }
  .mark {
    font:600 11px/1 "Inter",system-ui,sans-serif; letter-spacing:.22em;
    text-transform:uppercase; color:var(--gold); margin-bottom:20px;
  }
  h1 { font-size:22px; line-height:1.3; margin:0 0 12px; font-weight:600; }
  p { color:var(--muted); margin:0 0 24px; font-size:15px; }
  a.go {
    display:block; background:var(--card); border:1px solid var(--border);
    border-left:3px solid var(--gold); border-radius:8px;
    padding:14px 16px; text-decoration:none; color:var(--ink);
    font-weight:600; word-break:break-all;
  }
  a.go:hover { border-color:var(--gold); }
  .note { margin-top:20px; font-size:12px; color:var(--muted); }
  noscript p { color:var(--gold); }
</style>
</head>
<body>
<main>
  <div class="mark">Pocket Resus</div>
  <h1>This app has a new home</h1>
  <p>The GitHub Pages copy is retired and no longer updated. Redirecting you now&nbsp;&mdash;</p>
  <a class="go" id="target" href="https://pocket-resus.web.app/">pocket-resus.web.app</a>
  <noscript><p>JavaScript is off &mdash; this app needs it. Use the link above.</p></noscript>
  <div class="note">Please update your bookmark &mdash; this address now only forwards.</div>
</main>
<script>
  // Carry the deep link across: /pocket-resus/dx/foo -> https://pocket-resus.web.app/dx/foo
  (function () {
    var NEW = "https://pocket-resus.web.app";
    var p = location.pathname.replace(/^\/pocket-resus(?=\/|$)/, "");
    if (p === "/index.html") p = "/";
    if (!p.startsWith("/")) p = "/" + p;
    var url = NEW + p + location.search + location.hash;
    document.getElementById("target").href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
